version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is a major rewrite; Astro's type checker decides when we move.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["astro", "@astrojs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
