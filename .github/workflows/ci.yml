# Quality gate for every pull request (the Sveltia editorial workflow opens one per
# edit) and every push to main. Runs the same routine as `npm run verify`:
# type check + build + Pagefind + redirects + link/asset/anchor checks.
# Make the "verify" job a required status check in the `main` branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Production dependencies only: the picomatch ReDoS advisory (<=4.0.7, no fixed
      # release yet) sits in dev/build tooling. Never use `npm audit fix --force`:
      # it proposes downgrading Astro to 5.3.0.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check the Worker (types are generated from wrangler.jsonc)
        run: npm run check:worker
      - name: Unit tests
        run: npm test
      # `verify` runs astro check, the full build and every content/link check.
      # --offline skips the comparison against the live Drupal site.
      # PUBLIC_INDEXABLE=true builds the way production does (robots.txt allowing crawlers,
      # indexable pages), so the SEO checks validate the real thing. A local `npm run verify`
      # uses the safe default (noindex everywhere) and reports it as a warning.
      - name: Verify (check + build + content checks)
        run: npm run verify -- --offline
        env:
          PUBLIC_INDEXABLE: "true"

  # Accessibility and HTML validity of the BUILT site, in a real browser. Runs in parallel with `verify`
  # (it builds on its own: the dist artifact is ~300 MB of images, slower to move than to rebuild).
  # `wrangler dev --local` serves dist/ like production does (_headers, _redirects, 404 page), and
  # Playwright drives Chromium: axe-core WCAG 2.2 AA, reflow, text spacing, keyboard, focus, reduced motion.
  # Make this job a required status check too, next to `verify`.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - name: Install Chromium system libraries
        run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Build as production does (indexable)
        run: npm run build
        env:
          PUBLIC_INDEXABLE: "true"
      - name: HTML validity (html-validate over every page)
        run: npm run validate:html
      - name: Accessibility gate (axe, reflow, keyboard, focus, reduced motion, CSP)
        run: npm run a11y
      - name: Security headers on real responses (CSP header, HSTS, /admin intact)
        run: npm run check:headers
