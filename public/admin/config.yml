# Sveltia CMS (Decap-compatible). Edit content as Markdown + frontmatter in git.
# Editors sign in with a GitHub personal access token (fine-grained, Contents +
# Pull requests: read & write on this repo only). Their permissions are their
# GitHub role on the repo; protect `main` so only reviewers can merge.
backend:
  name: github
  repo: hyperborea-labtis/hyperborea-labtis
  branch: main

# Editorial workflow: each save opens a pull request. Editors move an entry
# Draft → In Review → Ready; publishing merges it into `main` (and deploys).
# Needs write access to the repo; protect `main` so only reviewers can merge.
publish_mode: editorial_workflow

# Local editing needs no config: open /admin/index.html on `npm run dev` in a
# Chromium browser and choose "Work with Local Repository" (no proxy server).

# Same location as the current Drupal site, so every file URL stays identical.
media_folder: public/sites/default/files
public_folder: /sites/default/files

# Uploads are optimized in the browser (WebP, max 2048px) and capped at 20 MB so
# new media does not bloat the repository or slow the site.
media_libraries:
  default:
    config:
      max_file_size: 20971520
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

# Folder-based i18n: files live in src/content/<collection>/<locale>/<slug>.md
i18n:
  structure: multiple_folders
  locales: [es, en, fr]
  default_locale: es

collections:
  - name: papers
    label: Papers (artículos académicos)
    label_singular: Paper
    folder: src/content/papers
    create: true
    i18n: true
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: slug, label: Slug (URL), widget: string, i18n: duplicate, hint: "Es la dirección pública. En contenido ya publicado NO lo cambies: si lo haces, agrega la dirección anterior en URLs antiguas." }
      - { name: translationKey, label: ID Drupal (solo contenido importado), widget: string, required: false, i18n: duplicate, hint: "Déjalo vacío en contenido nuevo. Es el ID del nodo original en Drupal." }
      - { name: created, label: Fecha y hora de creación (orden en portada y listados), widget: datetime, required: false, i18n: duplicate, date_format: "YYYY-MM-DD", time_format: "HH:mm", picker_utc: true, hint: "Los listados ordenan del más nuevo al más viejo por esta fecha y hora. En contenido importado viene de Drupal: no la cambies. En contenido nuevo déjala vacía (se usa la fecha de publicación)." }
      - name: section
        label: Sección
        widget: select
        required: false
        i18n: duplicate
        options: ["Mare Sugenum", "Kino LabTIS", "Manet et manebit", "41º 9’ S 71º 8’ W", "Afinidades electivas"]
      - { name: issue, label: Número de Hyperborea, widget: number, value_type: int, min: 1, required: false, i18n: duplicate, hint: "1 a 8. Define en qué número (/numero-N) aparece el paper." }
      - { name: issueOrder, label: Orden dentro del número, widget: number, value_type: int, min: 1, required: false, i18n: duplicate, hint: "1 = primero. Los que no tienen orden van al final del número." }
      - { name: author, label: Autor/a, widget: string, required: false, i18n: duplicate }
      - { name: email, label: Email, widget: string, required: false, i18n: duplicate }
      - { name: affiliation, label: Afiliación, widget: string, required: false, i18n: true }
      - { name: abstract, label: Resumen, widget: text, required: false, i18n: true }
      - { name: abstractSource, label: Autoría del resumen, widget: select, options: [{ label: "Del autor/a", value: author }, { label: "Elaborado por la redacción", value: editorial }], required: false, i18n: duplicate, hint: "«Elaborado por la redacción» muestra esa etiqueta bajo el resumen. Si el autor/a envía el suyo, cámbialo a «Del autor/a»." }
      - name: keywords
        label: Palabras clave
        widget: relation
        collection: vocabulary
        search_fields: [name]
        value_field: name
        display_fields: [name]
        multiple: true
        required: false
        i18n: duplicate
        hint: "Elige del menú (se puede buscar). Si falta una palabra, agrégala antes en «Vocabulario de palabras clave»."
      - { name: receivedDate, label: Fecha de recepción, widget: datetime, required: false, i18n: duplicate, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: evaluatedDate, label: Fecha de evaluación, widget: datetime, required: false, i18n: duplicate, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: publishedDate, label: Fecha de publicación, widget: datetime, required: false, i18n: duplicate, hint: "Se muestra bajo el paper. Déjala vacía si no hay fecha de publicación real.", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: heroImage, label: Imagen destacada, widget: image, required: false, i18n: duplicate }
      - { name: heroAlt, label: Descripción de la imagen destacada (texto alternativo), widget: string, required: false, i18n: true, hint: "Para personas que no ven la imagen: descríbela en una frase (qué se ve). Déjala vacía si es solo decorativa; el título ya aparece al lado." }
      - { name: pdf, label: PDF, widget: file, required: false, i18n: duplicate }
      - { name: aliases, label: URLs antiguas (redirecciones), widget: list, required: false, i18n: duplicate, hint: "Direcciones que deben seguir funcionando y llevar a este contenido, p. ej. /es/paper/slug-anterior. Una por línea, empiezan con /." }
      - { name: sourceUrl, label: URL original, widget: string, required: false, i18n: duplicate }
      - { name: draft, label: Ocultar del sitio (despublicar), widget: boolean, default: false, i18n: duplicate, hint: "Solo para retirar algo ya publicado. El estado Borrador/Revisión/Publicado se gestiona con el flujo editorial." }
      - { name: body, label: Cuerpo, widget: markdown, i18n: true }

  - name: articles
    label: Actividades
    label_singular: Actividad
    folder: src/content/articles
    create: true
    i18n: true
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: slug, label: Slug (URL), widget: string, i18n: duplicate, hint: "Es la dirección pública. En contenido ya publicado NO lo cambies: si lo haces, agrega la dirección anterior en URLs antiguas." }
      - { name: translationKey, label: ID Drupal (solo contenido importado), widget: string, required: false, i18n: duplicate, hint: "Déjalo vacío en contenido nuevo. Es el ID del nodo original en Drupal." }
      - { name: created, label: Fecha y hora de creación (orden en portada y listados), widget: datetime, required: false, i18n: duplicate, date_format: "YYYY-MM-DD", time_format: "HH:mm", picker_utc: true, hint: "Los listados ordenan del más nuevo al más viejo por esta fecha y hora. En contenido importado viene de Drupal: no la cambies. En contenido nuevo déjala vacía (se usa la fecha de publicación)." }
      - { name: publishedDate, label: Fecha, widget: datetime, required: false, i18n: duplicate, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: heroImage, label: Imagen destacada, widget: image, required: false, i18n: duplicate }
      - { name: heroAlt, label: Descripción de la imagen destacada (texto alternativo), widget: string, required: false, i18n: true, hint: "Para personas que no ven la imagen: descríbela en una frase (qué se ve). Déjala vacía si es solo decorativa; el título ya aparece al lado." }
      - { name: pdf, label: PDF, widget: file, required: false, i18n: duplicate }
      - { name: aliases, label: URLs antiguas (redirecciones), widget: list, required: false, i18n: duplicate, hint: "Direcciones que deben seguir funcionando y llevar a este contenido, p. ej. /es/paper/slug-anterior. Una por línea, empiezan con /." }
      - { name: sourceUrl, label: URL original, widget: string, required: false, i18n: duplicate }
      - { name: draft, label: Ocultar del sitio (despublicar), widget: boolean, default: false, i18n: duplicate, hint: "Solo para retirar algo ya publicado. El estado Borrador/Revisión/Publicado se gestiona con el flujo editorial." }
      - { name: body, label: Cuerpo, widget: markdown, i18n: true }

  - name: pages
    label: Páginas institucionales
    label_singular: Página
    folder: src/content/pages
    create: true
    i18n: true
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: slug, label: Slug (URL), widget: string, i18n: duplicate, hint: "Es la dirección pública. En contenido ya publicado NO lo cambies: si lo haces, agrega la dirección anterior en URLs antiguas." }
      - { name: translationKey, label: ID Drupal (solo contenido importado), widget: string, required: false, i18n: duplicate, hint: "Déjalo vacío en contenido nuevo. Es el ID del nodo original en Drupal." }
      - { name: aliases, label: URLs antiguas (redirecciones), widget: list, required: false, i18n: duplicate, hint: "Direcciones que deben seguir funcionando y llevar a este contenido, p. ej. /es/paper/slug-anterior. Una por línea, empiezan con /." }
      - { name: sourceUrl, label: URL original, widget: string, required: false, i18n: duplicate }
      - { name: draft, label: Ocultar del sitio (despublicar), widget: boolean, default: false, i18n: duplicate, hint: "Solo para retirar algo ya publicado. El estado Borrador/Revisión/Publicado se gestiona con el flujo editorial." }
      - { name: body, label: Cuerpo, widget: markdown, i18n: true }

  # Vocabulary behind the "Palabras clave" menu of papers: one file per term in
  # src/data/keywords/, so the CMS list has search and sorting. Terms imported
  # from Drupal keep their old id (`tid`) because their pages /taxonomy/term/<tid>
  # are already indexed (names must be unique for the menu, so repeated Drupal
  # terms are merged, with their other ids in `alsoTids`). Terms added here have
  # no id and get a page named after them. Deleting is off: it would break
  # indexed URLs and papers that use the term.
  - name: vocabulary
    label: Vocabulario de palabras clave
    label_singular: Palabra clave
    folder: src/data/keywords
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: name
    slug: "{{fields.name}}"
    summary: "{{name}}"
    sortable_fields: { fields: [name, tid], default: { field: name, direction: Ascending } }
    fields:
      - { name: name, label: Palabra clave, widget: string, hint: "Los papers enlazan la palabra por su nombre. Si cambias el nombre de una que ya se usa, el sitio no compila hasta que cambies también esos papers; pide ayuda en ese caso." }
      - { name: tid, label: ID Drupal (solo términos importados), widget: number, value_type: int, required: false, hint: "Déjalo vacío en términos nuevos." }
      - { name: alsoTids, label: Otros IDs Drupal (mismo nombre), widget: list, field: { name: tid, label: ID Drupal, widget: number, value_type: int }, required: false, hint: "Solo importados: IDs antiguos de términos repetidos que se unieron en este. Déjalo vacío en términos nuevos." }
